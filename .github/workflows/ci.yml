name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      scripts_dir: gemini-rtsw-ci
      # Packages the committed .lod files; nothing is compiled (see the spec).
      profile: lightweight
      el_version: '8'

  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
